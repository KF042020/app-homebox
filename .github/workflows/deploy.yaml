---
name: CI and publish

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/app-ci-custom.yaml

  build:
    if: github.event_name == 'push'
    needs: ci
    name: Build & push ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: aarch64
            platform: linux/arm64/v8
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: metadata
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: homebox
          file: homebox/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/kf042020/homebox:${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
            BUILD_DESCRIPTION=Inventory and organization system for the things in your home
            BUILD_FROM=ghcr.io/hassio-addons/base:21.0.11
            BUILD_NAME=Homebox
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=KF042020/app-homebox
            BUILD_VERSION=0.26.3

  manifest:
    if: github.event_name == 'push'
    name: Create multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        env:
          IMAGE: ghcr.io/kf042020/homebox
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:dev" --tag "${IMAGE}:0.26.3" "${IMAGE}:${SHA}-amd64" "${IMAGE}:${SHA}-aarch64"
