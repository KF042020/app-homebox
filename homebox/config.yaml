---
name: Homebox
version: dev
slug: homebox
description: Inventory and organization system for the things in your home
url: https://github.com/KF042020/app-homebox
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:package-variant-closed
init: false
arch:
  - aarch64
  - amd64
backup: cold
map:
  - type: ssl
    read_only: true
ports:
  7745/tcp: null
ports_description:
  7745/tcp: Web interface & API (not required for Ingress)
options:
  allow_registration: true
  auto_increment_asset_id: true
  max_upload_size: 10
  label_maker_enabled: false
  label_maker_padding: 5
  label_maker_margin: 5
  label_maker_width: 320
  label_maker_height: 96
  label_maker_dynamic_length: false
  label_maker_font_size: 24
  label_maker_print_command: "cp {{.FileName}} /data/homebox/labels/label.png"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_topic: homebox/labels
  mqtt_username: ""
  mqtt_password: ""
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  base_url: url?
  allow_registration: bool
  auto_increment_asset_id: bool
  max_upload_size: int(1,)
  label_maker_enabled: bool
  label_maker_padding: int(0,)
  label_maker_margin: int(0,)
  label_maker_width: int(1,)
  label_maker_height: int(1,)
  label_maker_dynamic_length: bool
  label_maker_font_size: int(1,)
  label_maker_print_command: str
  mqtt_host: str
  mqtt_port: port
  mqtt_topic: str
  mqtt_username: str?
  mqtt_password: password?
  smtp_host: str?
  smtp_port: port?
  smtp_from: email?
  smtp_user: str?
  smtp_password: password?
  ssl: bool
  certfile: str
  keyfile: str
